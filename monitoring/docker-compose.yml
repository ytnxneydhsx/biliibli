services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: bilibili-prometheus
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        sed \
          -e "s/__PROMETHEUS_SCRAPE_INTERVAL__/${PROMETHEUS_SCRAPE_INTERVAL:-1s}/g" \
          -e "s/__PROMETHEUS_EVALUATION_INTERVAL__/${PROMETHEUS_EVALUATION_INTERVAL:-1s}/g" \
          /etc/prometheus/templates/prometheus.yml > /tmp/prometheus.yml && \
        exec /bin/prometheus \
          --config.file=/tmp/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --web.console.libraries=/usr/share/prometheus/console_libraries \
          --web.console.templates=/usr/share/prometheus/consoles
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/templates/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
      - business

  grafana:
    image: grafana/grafana:11.3.1
    container_name: bilibili-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: ${GRAFANA_MIN_REFRESH_INTERVAL:-1s}
      GF_PATHS_PROVISIONING: /tmp/grafana-provisioning
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        rm -rf /tmp/grafana-dashboards /tmp/grafana-provisioning && \
        mkdir -p /tmp/grafana-dashboards /tmp/grafana-provisioning/datasources /tmp/grafana-provisioning/dashboards && \
        cp /etc/grafana/provisioning-templates/datasources/prometheus.yml /tmp/grafana-provisioning/datasources/prometheus.yml && \
        cp /etc/grafana/provisioning-templates/dashboards/dashboards.yml /tmp/grafana-provisioning/dashboards/dashboards.yml && \
        cp /var/lib/grafana/dashboard-templates/*.json /tmp/grafana-dashboards/ && \
        sed -i "s/__GRAFANA_PROMETHEUS_TIME_INTERVAL__/${GRAFANA_PROMETHEUS_TIME_INTERVAL:-1s}/g" /tmp/grafana-provisioning/datasources/prometheus.yml && \
        find /tmp/grafana-dashboards -name '*.json' -exec sed -i "s/\"refresh\": \"1s\"/\"refresh\": \"${GRAFANA_DASHBOARD_REFRESH:-1s}\"/g" {} \; && \
        sed -i "s|/var/lib/grafana/dashboards|/tmp/grafana-dashboards|g" /tmp/grafana-provisioning/dashboards/dashboards.yml && \
        exec /run.sh
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning-templates:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboard-templates:ro
    networks:
      - monitoring

  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    container_name: bilibili-cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "${CADVISOR_PORT:-8081}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: bilibili-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    volumes:
      - /:/host:ro
    networks:
      - monitoring

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: bilibili-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: ${REDIS_ADDR:-redis://redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_EXPORTER_PORT:-9121}:9121"
    networks:
      - monitoring
      - business

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.16.0
    container_name: bilibili-mysqld-exporter
    restart: unless-stopped
    command:
      - --config.my-cnf=/etc/mysqld-exporter/.my.cnf
      - --collect.global_status
      - --collect.global_variables
      - --collect.info_schema.innodb_metrics
      - --collect.info_schema.processlist
      - --collect.perf_schema.eventsstatements
      - --collect.perf_schema.eventswaits
    ports:
      - "${MYSQLD_EXPORTER_PORT:-9104}:9104"
    volumes:
      - ./mysql/.my.cnf:/etc/mysqld-exporter/.my.cnf:ro
    networks:
      - monitoring
      - business

networks:
  monitoring:
    name: bilibili-monitoring
  business:
    external: true
    name: ${BUSINESS_DOCKER_NETWORK}

volumes:
  prometheus_data:
  grafana_data:
