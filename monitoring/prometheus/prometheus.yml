global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: bilibili
    environment: local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets:
          - grafana:3000

  - job_name: spring-boot-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - app:8080
        labels:
          service: bilibili-app

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets:
          - rabbitmq:15692
        labels:
          service: bilibili-rabbitmq

  - job_name: redis
    metrics_path: /metrics
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          service: bilibili-redis

  - job_name: mysql
    metrics_path: /metrics
    static_configs:
      - targets:
          - mysqld-exporter:9104
        labels:
          service: bilibili-mysql

  - job_name: cadvisor
    metrics_path: /metrics
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: node
    metrics_path: /metrics
    static_configs:
      - targets:
          - node-exporter:9100
